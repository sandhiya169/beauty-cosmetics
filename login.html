<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Stackly</title>
<meta name="description" content="Sign in to your Stackly account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

<div class="authpage">

  <div class="authpage__visual">
    <img src="assets/images/cosmetics.webp" alt="cosmetics">
    <div class="authpage__visual-copy">
      <p class="eyebrow">Welcome back</p>
      <h2>Rituals worth returning to.</h2>
      <p>Sign in to track orders, save favourites and get early access to new formulas.</p>
    </div>
  </div>

  <div class="authpage__form-side">
    <div class="authcard">
      <div class="authcard__topbar">
        <a href="index.html" class="authcard__mark">
          <img src="assets/images/stackly-logo.webp" alt="Stackly">
        </a>
        <a href="index.html" class="authcard__back">Back to home <span aria-hidden="true">→</span></a>
      </div>

      <div class="authcard__head">
        <h1 id="loginHeading">Welcome back</h1>
        <p id="loginSub">Sign in to view orders, rituals and rewards.</p>
      </div>

      <div class="authtabs" role="tablist" aria-label="Login as">
        <button type="button" class="authtab is-active" data-role="customer">Customer</button>
        <button type="button" class="authtab" data-role="admin">Admin</button>
      </div>

      <form class="authform" id="loginForm" novalidate>
        <div class="authfield" id="loginEmailField">
          <label for="loginEmail">Email address</label>
          <div class="authfield__control">
            <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="off">
          </div>
          <span class="authfield__error"></span>
        </div>

        <div class="authfield" id="loginPasswordField">
          <label for="loginPassword">Password</label>
          <div class="authfield__control">
            <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="off">
            <button type="button" class="authfield__toggle">Show</button>
          </div>
          <span class="authfield__error"></span>
        </div>

        <div class="authform__row">
          <label class="authform__remember">
            <input type="checkbox"> Remember me
          </label>
          <a href="404.html" class="authform__forgot">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn--solid">Sign in</button>
        <p class="authnote" id="loginNote"></p>
      </form>

      <div class="authdivider">or continue with</div>

      <div class="authsocial">
        <a href="404.html" type="button" class="authsocial-btn" id="googleLoginBtn">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
          Sign in with Google
        </a>
      </div>

      <p class="authcard__foot">Don't have an account? <a href="signup.html">Create one</a></p>
    </div>
  </div>

</div>

<script src="assets/js/auth.js"></script>
</body>
</html>
